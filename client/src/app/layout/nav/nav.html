<header class="sticky top-0 z-50 w-full bg-linear-to-r from-primary to-secondary shadow-md">
  <div class="mx-auto flex max-w-7xl items-center gap-8 px-6 py-3">

    <a class="flex cursor-pointer items-center gap-2 text-2xl font-bold text-primary-content">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
        <path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
      </svg>
      <span>Dating App</span>
    </a>

    <nav class="hidden gap-6 text-sm font-semibold uppercase tracking-wide text-primary-content/80 md:flex">
      <a class="cursor-pointer transition-colors hover:text-primary-content">Matches</a>
      <a class="cursor-pointer transition-colors hover:text-primary-content">Lists</a>
      <a class="cursor-pointer transition-colors hover:text-primary-content">Messages</a>
    </nav>

    <form #loginForm="ngForm" (ngSubmit)="login()" class="ml-auto flex items-center gap-2">
      <input [(ngModel)]="creds.email" name="email" type="text" placeholder="email" class="input input-sm w-36" />
      <input [(ngModel)]="creds.password" name="password" type="password" placeholder="Password" class="input input-sm w-36" />
      <button type="submit" class="btn btn-sm btn-neutral">Login</button>
    </form>

  </div>
</header>
